<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lunak의 바이브코딩 대시보드</title>
  <meta name="description" content="기획부터 제작, 배포까지 직접 만든 바이브코딩 결과물을 공유합니다." />

  <!-- 한글 웹폰트(Pretendard). 인터넷이 없으면 기기 기본 글꼴로 자동 대체됩니다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <style>
    /* =========================================================
       ✏️ 색상 바꾸기: 아래 값만 수정하면 전체 색이 바뀝니다.
       --accent 가 유일한 포인트 색상입니다.
       ========================================================= */
    :root {
      --bg: #fbfbfd;          /* 페이지 배경(밝은 흰색) */
      --surface: #ffffff;     /* 카드 배경 */
      --text: #1d1d1f;        /* 기본 글자색 */
      --muted: #6e6e73;       /* 보조 글자색 */
      --line: #e5e5ea;        /* 구분선 */
      --accent: #0071e3;      /* 포인트 색상(파랑) */
      --accent-soft: rgba(0, 113, 227, 0.1);
      --radius: 28px;
      --max: 1120px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    .container {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- 1. 상단 제목 바 ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(251, 251, 253, 0.8);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .topbar h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .topbar a {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
    }
    .topbar a:hover { text-decoration: underline; }

    /* ---------- 2·3. 메인 영역(히어로) ---------- */
    .hero {
      text-align: center;
      padding: 120px 0 96px;
      overflow: hidden;
    }
    .eyebrow {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }
    .hero h2 {
      font-size: clamp(40px, 7.5vw, 88px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.04em;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero h2 .accent { color: var(--accent); }
    .hero p {
      margin: 28px auto 0;
      font-size: clamp(18px, 2.2vw, 24px);
      color: var(--muted);
      max-width: 640px;
    }

    /* CSS만으로 만든 장식 그래픽(이미지 파일 없음) */
    .visual {
      position: relative;
      width: min(440px, 80vw);
      aspect-ratio: 1;
      margin: 80px auto 0;
    }
    .visual .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
    }
    .visual .ring.r2 { inset: 12%; }
    .visual .ring.r3 { inset: 24%; border-color: var(--accent-soft); border-width: 2px; }
    .visual .core {
      position: absolute;
      inset: 32%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #eaf3ff 35%, var(--accent) 120%);
      box-shadow:
        0 30px 60px -20px rgba(0, 113, 227, 0.45),
        inset 0 -10px 30px rgba(0, 113, 227, 0.2);
      animation: float 6s ease-in-out infinite;
    }
    .visual .orbit {
      position: absolute;
      inset: 12%;
      animation: spin 18s linear infinite;
    }
    .visual .orbit::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }
    .visual .label {
      position: absolute;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .visual .l1 { top: 18%; left: -4%; }
    .visual .l2 { top: 48%; right: -8%; }
    .visual .l3 { bottom: 10%; left: 6%; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ---------- 4. 결과물 카드 목록 ---------- */
    .works {
      padding: 96px 0 120px;
      border-top: 1px solid var(--line);
    }
    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .section-head h3 {
      font-size: clamp(32px, 4.5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }
    .section-head .count {
      font-size: 15px;
      color: var(--muted);
    }
    .section-head .count strong { color: var(--accent); }

    /* PC: 3개 나란히 / 태블릿: 2개 / 모바일: 1개 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px;
      min-height: 320px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:not(.is-ready):hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.18);
    }
    .card .week {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .card h4 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .card p {
      color: var(--muted);
      font-size: 16px;
      flex: 1;
    }
    .card .badge {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 20px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
      padding: 13px 24px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      font-family: inherit;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }

    /* 준비 중 카드 */
    .card.is-ready {
      background: transparent;
      border-style: dashed;
    }
    .card.is-ready .week,
    .card.is-ready .badge { color: var(--muted); background: #f0f0f3; }
    .card.is-ready .week { background: none; }
    .card.is-ready h4 { color: var(--muted); }
    .btn[disabled] {
      background: #ececf0;
      color: #a1a1a6;
      cursor: not-allowed;
    }

    /* ---------- 5. 하단 ---------- */
    footer {
      border-top: 1px solid var(--line);
      padding: 32px 0 48px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- 반응형 ---------- */
    @media (max-width: 960px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .container { padding: 0 20px; }
      .hero { padding: 80px 0 64px; }
      .visual { margin-top: 56px; }
      .visual .label { font-size: 12px; padding: 5px 11px; }
      .visual .l2 { right: -2%; }
      .works { padding: 64px 0 80px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: auto; padding: 28px; }
    }

    /* 움직임 줄이기 설정을 켠 사용자를 위해 애니메이션 정지 */
    @media (prefers-reduced-motion: reduce) {
      .visual .core, .visual .orbit { animation: none; }
      .card, .btn { transition: none; }
    }
  </style>
</head>
<body>

  <!-- 1. 상단 제목 -->
  <header class="topbar">
    <div class="container">
      <h1>lunak의 바이브코딩 대시보드</h1>
      <a href="#works">결과물 보기</a>
    </div>
  </header>

  <main>
    <!-- 2·3. 메인 제목 + 소개 문구 -->
    <section class="hero">
      <div class="container">
        <span class="eyebrow">Vibe Coding Portfolio</span>
        <h2>아이디어를 웹앱으로,<br /><span class="accent">나의 바이브코딩 기록</span></h2>
        <p>기획부터 제작, 배포까지 직접 만든 결과물을 공유합니다.</p>

        <!-- CSS로만 그린 장식 그래픽 -->
        <div class="visual" aria-hidden="true">
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="orbit"></div>
          <div class="core"></div>
          <span class="label l1">💡 기획</span>
          <span class="label l2">🛠️ 제작</span>
          <span class="label l3">🚀 배포</span>
        </div>
      </div>
    </section>

    <!-- 4. 차시별 결과물 카드 목록 (아래 JavaScript가 자동으로 채웁니다) -->
    <section class="works" id="works">
      <div class="container">
        <div class="section-head">
          <h3>차시별 결과물</h3>
          <span class="count" id="count"></span>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>

  <!-- 5. 하단 문구 -->
  <footer>
    <div class="container">© 2026 lunak. 바이브코딩으로 만든 나의 작품집.</div>
  </footer>

  <script>
    /* =========================================================
       ✏️ 여기만 수정하세요! — 차시별 결과물 목록
       ---------------------------------------------------------
       · 새 차시를 추가하려면 { ... } 한 덩어리를 복사해서
         맨 아래에 붙여 넣고 내용을 바꾸면 됩니다.
       · 각 덩어리 끝에는 쉼표(,)를 꼭 붙여 주세요.
       · link 에 주소를 넣으면 "결과물 보기" 버튼이 활성화되고,
         link 를 "" (빈 칸)으로 두면 "준비 중" 카드로 표시됩니다.
       ========================================================= */
    const works = [
      {
        week: "1주차",                                   // 차시 이름
        title: "나의 첫 바이브코딩 결과물",                 // 카드 제목
        desc: "AI와 함께 만든 첫 번째 작품입니다.",          // 카드 설명
        link: "https://claude.ai/artifact/Vs3LvPgMjzXYyt61PXEWiX" // 결과물 링크
      },
      {
        week: "2주차",
        title: "준비 중",
        desc: "다음 결과물을 열심히 만들고 있어요.",
        link: ""                                         // 비워 두면 '준비 중'
      },
      {
        week: "3주차",
        title: "준비 중",
        desc: "다음 결과물을 열심히 만들고 있어요.",
        link: ""
      },
      // ⬇️ 4주차부터는 여기에 이어서 추가하세요. (예시)
      // {
      //   week: "4주차",
      //   title: "나만의 할 일 관리 앱",
      //   desc: "매일 할 일을 정리하는 웹앱입니다.",
      //   link: "https://여기에-결과물-주소"
      // },
    ];

    /* =========================================================
       아래부터는 화면을 그리는 코드입니다. (수정하지 않아도 됩니다)
       ========================================================= */
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");

    // 글자 안의 특수문자를 안전하게 바꿔 줍니다.
    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    let doneCount = 0;

    works.forEach((item) => {
      const ready = !item.link;                // 링크가 없으면 '준비 중'
      if (!ready) doneCount++;

      const card = document.createElement("article");
      card.className = "card" + (ready ? " is-ready" : "");

      card.innerHTML = `
        <span class="badge">${ready ? "준비 중" : "공개"}</span>
        <div class="week">${escapeHTML(item.week)}</div>
        <h4>${escapeHTML(item.title)}</h4>
        <p>${escapeHTML(item.desc)}</p>
        ${
          ready
            ? `<button class="btn" type="button" disabled aria-disabled="true">준비 중</button>`
            : `<a class="btn btn-primary" href="${escapeHTML(item.link)}"
                  target="_blank" rel="noopener noreferrer">결과물 보기 <span aria-hidden="true">↗</span></a>`
        }
      `;
      grid.appendChild(card);
    });

    countEl.innerHTML = `공개 <strong>${doneCount}</strong> / 전체 ${works.length}`;
  </script>
</body>
</html>
